name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y luajit luarocks lua-cjson && sudo luarocks install luacheck
      - name: luacheck + pure tests
        run: ./dev.sh check
      - name: Package (zip + SHA256SUMS)
        run: SKIP_CHECK=1 ./empaquetar.sh
